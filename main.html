<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<div class="calculator">
		<input type="text" id="input" value="" placeholder="0" />

		<div class="keys">
			<button id="clr" class="clear">C</button>

			<button id="block7" class="num" data-v="7">7</button>
			<button id="block8" class="num" data-v="8">8</button>
			<button id="block9" class="num" data-v="9">9</button>
			<button id="divide" class="op" data-v="/">/</button>

			<button id="block4" class="num" data-v="4">4</button>
			<button id="block5" class="num" data-v="5">5</button>
			<button id="block6" class="num" data-v="6">6</button>
			<button id="multiply" class="op" data-v="*">*</button>

			<button id="block1" class="num" data-v="1">1</button>
			<button id="block2" class="num" data-v="2">2</button>
			<button id="block3" class="num" data-v="3">3</button>
			<button id="minus" class="op" data-v="-">-</button>

			<button id="block0" class="num" data-v="0">0</button>
			<button id="dot" class="num" data-v=".">.</button>
			<button id="ans" class="equals">=</button>
			<button id="plus" class="op" data-v="+">+</button>
		</div>
	</div>

	<script type="text/javascript" src="./script.js">
	</script>

</body>

</html>
